<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Course Details - LearnHub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link active">
                Courses
            </a>

            <a href="about.html" class="nav-link">
                About
            </a>

            <a href="contact.html" class="nav-link">
                Contact
            </a>

        </nav>

        <div class="nav-actions">

            <a href="wishlist.html" class="nav-icon">
                ♡
            </a>

            <a href="cart.html" class="nav-icon">

                🛒

                <span id="cart-count" class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</header>


<section class="course-detail">

    <div
        class="container"
        id="courseDetails"
    ></div>

</section>


<section class="section">
    <div class="container">
        <h2>Lessons</h2>
        <div id="lessonProgressWrap" hidden>
            <p id="lessonProgressText"></p>
            <progress id="lessonProgress" value="0" max="100" style="width:100%;"></progress>
        </div>
        <div id="lessonList"></div>
        <p id="lessonNote"></p>
    </div>
</section>

<script src="script.js"></script>
<script src="js/api.js"></script>
<script src="js/tutor.js"></script>


<script>

const params =
    new URLSearchParams(window.location.search);

const courseId =
    params.get("id") || 1;

const course =
    getCourseById(courseId);


const container =
    document.getElementById("courseDetails");


if (!course) {

    container.innerHTML = `
        <div class="empty-state">
            <h2>Course Not Found</h2>
            <a href="courses.html"
               class="btn btn-primary">
               Back to Courses
            </a>
        </div>
    `;

} else {

    container.innerHTML = `

        <div class="detail-grid">

            <div class="detail-main">

                <span class="section-tag">
                    ${course.category}
                </span>

                <h1>
                    ${course.title}
                </h1>

                <p class="detail-description">
                    ${course.description}
                </p>

                <p>
                    ⭐ ${course.rating}
                    &nbsp; | &nbsp;
                    ${course.students} students
                </p>

                <br>

                <div class="detail-image">

                    <img
                        src="${course.image}"
                        alt="${course.title}"
                    >

                </div>

                <br>

                <h2>
                    What You Will Learn
                </h2>

                <ul class="detail-list">

                    <li>
                        ✓ Complete course fundamentals
                    </li>

                    <li>
                        ✓ Practical real-world projects
                    </li>

                    <li>
                        ✓ Step-by-step learning
                    </li>

                    <li>
                        ✓ Certificate after completion
                    </li>

                </ul>

            </div>


            <div class="detail-card">

                <div class="detail-price">

                    ${formatPrice(course.price)}

                    <del>
                        ${formatPrice(course.oldPrice)}
                    </del>

                </div>


                <button
                    class="btn btn-primary"
                    onclick="addToCart(${course.id})"
                >
                    Add to Cart
                </button>


                <button
                    class="btn btn-outline"
                    onclick="addToWishlist(${course.id})"
                >
                    Add to Wishlist
                </button>


                <ul class="detail-list">

                    <li>
                        📚 ${course.lessons} Lessons
                    </li>

                    <li>
                        ⏱ ${course.hours} Hours
                    </li>

                    <li>
                        👨‍🏫 ${course.instructor}
                    </li>

                    <li>
                        🏆 Certificate Included
                    </li>

                    <li>
                        ♾ Lifetime Access
                    </li>

                </ul>

            </div>

        </div>

    `;

}

</script>


<script>
// Lessons + progress, wired to the backend when it is reachable.
// Falls back silently to the static page when the backend is down.
(function () {
    var listEl = document.getElementById("lessonList");
    var noteEl = document.getElementById("lessonNote");
    var wrapEl = document.getElementById("lessonProgressWrap");
    var barEl = document.getElementById("lessonProgress");
    var textEl = document.getElementById("lessonProgressText");
    if (!listEl || !window.LearnHubAPI) return;

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }
    function setProgress(pct) {
        wrapEl.hidden = false;
        barEl.value = pct;
        textEl.textContent = pct + "% complete";
    }
    async function refreshProgress(courseId) {
        try {
            var enrolments = await LearnHubAPI.getEnrollments();
            var mine = enrolments.find(function (e) {
                return String(e.course.id) === String(courseId);
            });
            if (mine) setProgress(mine.progress_percent);
        } catch (e) { /* not signed in / not enrolled: keep session progress */ }
    }
    async function load() {
        try {
            if (!(await LearnHubAPI.checkApi())) return;
            var params = new URLSearchParams(window.location.search);
            var courseId = params.get("id") || 1;
            var lessons = await LearnHubAPI.getLessons(courseId);
            if (!lessons.length) {
                noteEl.textContent = "No lessons published for this course yet.";
                return;
            }
            await refreshProgress(courseId);
            listEl.innerHTML = lessons.map(function (l) {
                return "<div class=\"lesson-row\" style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e8f0;\">" +
                    "<div style=\"flex:1\"><strong>" + esc(l.title) + "</strong>" +
                    (l.is_preview ? " <span>(free preview)</span>" : "") +
                    "<br><small>" + (l.duration_minutes || 0) + " min</small></div>" +
                    "<a class=\"btn btn-primary\" href=\"lesson.html?id=" + l.id + "\">Learn &rarr;</a>" +
                    "<button type=\"button\" class=\"btn btn-outline\" data-lesson-id=\"" + l.id + "\">Mark as complete</button></div>";
            }).join("");
            if (window.LearnHubTutor) LearnHubTutor.init({ courseId: Number(courseId) });
            listEl.querySelectorAll("[data-lesson-id]").forEach(function (btn) {
                btn.addEventListener("click", async function () {
                    try {
                        var res = await LearnHubAPI.completeLesson(btn.dataset.lessonId);
                        btn.disabled = true;
                        btn.textContent = "\u2713 Completed";
                        if (res && typeof res.progress_percent === "number") setProgress(res.progress_percent);
                        else await refreshProgress(courseId);
                        if (res && res.certificate) {
                            noteEl.textContent = "\uD83C\uDF89 Course complete! Your certificate is ready: certificate.html?id=" + res.certificate.id;
                        }
                    } catch (e) {
                        noteEl.textContent = "Could not mark complete: " + e.message +
                            " (sign in and enrol in this course first).";
                    }
                });
            });
        } catch (e) { /* backend unreachable: static page stays as-is */ }
    }
    document.addEventListener("DOMContentLoaded", load);
})();
</script>

</body>
</html>
