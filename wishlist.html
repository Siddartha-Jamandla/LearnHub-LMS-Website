<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist - LearnHub</title>

    <link rel="stylesheet" href="style.css">
    <script>(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lh_theme")||"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link">
                Courses
            </a>

            <a href="wishlist.html" class="nav-link active">
                Wishlist
            </a>

        </nav>

        <div class="nav-actions">

            <a href="cart.html" class="nav-icon">
                🛒
                <span id="cart-count" class="cart-count">
                    0
                </span>
            </a>

        </div>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            My Wishlist
        </h1>

        <p>
            Courses you want to learn later.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div
            id="wishlistList"
            class="course-grid"
        ></div>

    </div>

</section>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="script.js"></script>


<script>

// Signed-in users get the server-side wishlist (GET /api/wishlist);
// guests keep the original localStorage behaviour from script.js.

function escHtml(s) {
    return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function emptyStateHtml() {
    return `

            <div class="empty-state">

                <h2>
                    Your Wishlist is Empty
                </h2>

                <p>
                    Add courses you want to learn later.
                </p>

                <br>

                <a
                    href="courses.html"
                    class="btn btn-primary"
                >
                    Browse Courses
                </a>

            </div>

        `;
}

async function renderWishlist() {

    const container =
        document.getElementById("wishlistList");

    const useBackend =
        window.LearnHubAuth &&
        LearnHubAuth.isSignedIn() &&
        window.LearnHubAPI &&
        await LearnHubAPI.checkApi().catch(() => false);

    if (useBackend) {
        renderBackendWishlist(container);
        return;
    }

    renderLegacyWishlist(container);

}

async function renderBackendWishlist(container) {

    let items = [];

    try {
        items = await LearnHubAPI.getWishlist();
    } catch (e) {
        container.innerHTML = `

            <div class="empty-state">

                <h2>
                    Could not load your wishlist
                </h2>

                <p>
                    ${escHtml(e.message)}
                </p>

            </div>

        `;
        return;
    }

    if (items.length === 0) {
        container.innerHTML = emptyStateHtml();
        return;
    }

    container.innerHTML =
        items.map(item => `

                <div class="course-card">

                    <div class="course-image">

                        <img
                            src="${escHtml(item.image_url || "assets/images/course1.svg")}"
                            alt="${escHtml(item.title)}"
                        >

                    </div>


                    <div class="course-content">

                        <h3>
                            ${escHtml(item.title)}
                        </h3>

                        <p class="instructor">
                            ${escHtml(item.instructor)}
                            &nbsp;·&nbsp;${escHtml(item.level)}
                            &nbsp;·&nbsp;★ ${item.avg_rating}
                        </p>

                        <br>

                        <div class="course-footer">

                            <strong>
                                ${formatPrice(item.price)}
                            </strong>

                            <button
                                class="btn btn-primary btn-small"
                                onclick="addToCart(${item.id})"
                            >
                                Add to Cart
                            </button>

                        </div>

                        <br>

                        <button
                            class="btn btn-danger btn-small"
                            onclick="removeWishlistBackend(${item.id})"
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `).join("");

}

async function removeWishlistBackend(courseId) {

    try {
        await LearnHubAPI.removeFromWishlist(courseId);
        renderWishlist();
    } catch (e) {
        alert("Could not remove: " + e.message);
    }

}

function renderLegacyWishlist(container) {

    const wishlist =
        getWishlist();


    if (wishlist.length === 0) {

        container.innerHTML = emptyStateHtml();

        return;

    }


    container.innerHTML =
        wishlist.map(id => {

            const course =
                getCourseById(id);


            return `

                <div class="course-card">

                    <div class="course-image">

                        <img
                            src="${course.image}"
                            alt="${course.title}"
                        >

                    </div>


                    <div class="course-content">

                        <h3>
                            ${course.title}
                        </h3>

                        <p class="instructor">
                            ${course.instructor}
                        </p>

                        <br>

                        <div class="course-footer">

                            <strong>
                                ${formatPrice(course.price)}
                            </strong>

                            <button
                                class="btn btn-primary btn-small"
                                onclick="addToCart(${course.id})"
                            >
                                Add to Cart
                            </button>

                        </div>

                        <br>

                        <button
                            class="btn btn-danger btn-small"
                            onclick="removeFromWishlist(${course.id})"
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


document.addEventListener(
    "DOMContentLoaded",
    renderWishlist
);

</script>

</body>
</html>
