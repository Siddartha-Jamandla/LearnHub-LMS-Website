<script>

async function renderMyCourses() {
    // Backend first: real enrolments with real progress bars.
    // Any failure (offline, signed out) falls back to the legacy
    // localStorage rendering below, so the page never breaks.
    if (window.LearnHubAPI) {
        try {
            if (await LearnHubAPI.checkApi()) {
                var courses = await LearnHubAPI.getMyCourses();
                var container = document.getElementById("myCourseList");
                if (courses && courses.length) {
                    container.innerHTML = courses.map(function (c) {
                        var pct = c.progress_percent || 0;
                        return "<div class=\"course-card\"><div class=\"course-content\">" +
                            "<h3>" + c.title + "</h3>" +
                            "<p class=\"instructor\">" + c.instructor + "</p><br>" +
                            "<p id=\"pct-" + c.id + "\">" + pct + "% complete &middot; " + (c.lesson_count || 0) + " lessons</p>" +
                            "<progress id=\"bar-" + c.id + "\" value=\"" + pct + "\" max=\"100\" style=\"width:100%;\"></progress>" +
                            "<p id=\"meta-" + c.id + "\"></p><br>" +
                            "<a class=\"btn btn-primary\" href=\"course-details.html?id=" + c.id + "\">Continue learning</a>" +
                            " <button class=\"btn btn-outline\" type=\"button\" onclick=\"unenrollCourse(" + c.id + ", this)\">Unenroll</button>" +
                            "</div></div>";
                    }).join("");
                    // Refresh each card from GET /api/courses/:id/progress -
                    // the authoritative recompute (done/total lessons,
                    // next lesson, certificate code at 100%).
                    courses.forEach(function (c) {
                        LearnHubAPI.getCourseProgress(c.id).then(function (p) {
                            var pctEl = document.getElementById("pct-" + c.id);
                            var barEl = document.getElementById("bar-" + c.id);
                            var metaEl = document.getElementById("meta-" + c.id);
                            if (!pctEl || !barEl || !metaEl) return;
                            var pct = p.progress_percent || 0;
                            pctEl.textContent = pct + "% complete · " + p.completed_lessons + "/" + p.total_lessons + " lessons";
                            barEl.value = pct;
                            var meta = "";
                            if (p.next_lesson_id) {
                                meta += "Next: <a href=\"lesson.html?id=" + p.next_lesson_id + "\">" + p.next_lesson_title + "</a>";
                            }
                            if (p.certificate_code) {
                                meta += (meta ? " · " : "") + "<a href=\"certificate.html?code=" + encodeURIComponent(p.certificate_code) + "\">Certificate ready</a>";
                            }
                            metaEl.innerHTML = meta;
                        }).catch(function () { /* keep the my-courses figure */ });
                    });
                    return;
                }
            }
        } catch (e) { /* fall through to legacy rendering */ }
    }
    renderMyCoursesLegacy();
}


// Unenroll from a course (DELETE /api/enrollments/:id). Lesson progress
// is deleted, so a later re-enrolment starts fresh; an earned
// certificate is permanent and is kept. The list reloads from the API.
async function unenrollCourse(courseId, btn) {
    if (!confirm("Unenroll from this course? Your lesson progress will be deleted (an earned certificate is kept).")) return;
    if (btn) btn.disabled = true;
    try {
        await LearnHubAPI.unenroll(courseId);
        renderMyCourses();
    } catch (e) {
        alert("Could not unenroll: " + (e.message || "please try again"));
        if (btn) btn.disabled = false;
    }
}

function renderMyCoursesLegacy() {


    const ids =
        JSON.parse(
            localStorage.getItem("myCourses")
        ) || [];


    const container =
        document.getElementById("myCourseList");


    if (ids.length === 0) {

        container.innerHTML = `

            <div class="empty-state">

                <h2>
                    No courses yet
                </h2>

                <p>
                    Purchase a course to start learning.
                </p>

                <br>

                <a
                    href="courses.html"
                    class="btn btn-primary"
                >
                    Explore courses
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML =
        ids.map(id => {

            const course =
                getCourseById(id);

            return `

                <div class="course-card">

                    <div class="course-image">

                        <img
                            src="${course.image}"
                            alt="${course.title}"
                        >

                    </div>


                    <div class="course-content">

                        <h3>
                            ${course.title}
                        </h3>

                        <p class="instructor">
                            ${course.instructor}
                        </p>

                        <br>

                        <p>
                            Progress
                        </p>

                        <progress
                            value="25"
                            max="100"
                            style="width:100%;"
                        ></progress>

                        <br><br>

                        <button
                            class="btn btn-primary"
                            onclick="alert('Course learning page can be added later.')"
                        >
                            Continue learning
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


document.addEventListener(
    "DOMContentLoaded",
    renderMyCourses
);

</script>
