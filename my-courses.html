<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Courses - LearnHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link">
                Courses
            </a>

            <a href="my-courses.html" class="nav-link active">
                My Courses
            </a>

            <a href="profile.html" class="nav-link">
                Profile
            </a>

                    <a href="dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="learning-paths.html" class="nav-link">
                Learning Paths
            </a>

</nav>

        <div class="nav-actions">

            <a href="cart.html" class="nav-icon">
                🛒
                <span id="cart-count" class="cart-count">
                    0
                </span>
            </a>

        </div>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            My Courses
        </h1>

        <p>
            Continue your learning journey.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div
            id="myCourseList"
            class="course-grid"
        ></div>

    </div>

</section>


<script src="script.js"></script>
<script src="js/api.js"></script>


<script>

async function renderMyCourses() {
    // Backend first: real enrolments with real progress bars.
    // Any failure (offline, signed out) falls back to the legacy
    // localStorage rendering below, so the page never breaks.
    if (window.LearnHubAPI) {
        try {
            if (await LearnHubAPI.checkApi()) {
                var courses = await LearnHubAPI.getMyCourses();
                var container = document.getElementById("myCourseList");
                if (courses && courses.length) {
                    container.innerHTML = courses.map(function (c) {
                        var pct = c.progress_percent || 0;
                        return "<div class=\"course-card\"><div class=\"course-content\">" +
                            "<h3>" + c.title + "</h3>" +
                            "<p class=\"instructor\">" + c.instructor + "</p><br>" +
                            "<p>" + pct + "% complete &middot; " + (c.lesson_count || 0) + " lessons</p>" +
                            "<progress value=\"" + pct + "\" max=\"100\" style=\"width:100%;\"></progress><br><br>" +
                            "<a class=\"btn btn-primary\" href=\"course-details.html?id=" + c.id + "\">Continue Learning</a>" +
                            "</div></div>";
                    }).join("");
                    return;
                }
            }
        } catch (e) { /* fall through to legacy rendering */ }
    }
    renderMyCoursesLegacy();
}

function renderMyCoursesLegacy() {


    const ids =
        JSON.parse(
            localStorage.getItem("myCourses")
        ) || [];


    const container =
        document.getElementById("myCourseList");


    if (ids.length === 0) {

        container.innerHTML = `

            <div class="empty-state">

                <h2>
                    No Courses Yet
                </h2>

                <p>
                    Purchase a course to start learning.
                </p>

                <br>

                <a
                    href="courses.html"
                    class="btn btn-primary"
                >
                    Explore Courses
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML =
        ids.map(id => {

            const course =
                getCourseById(id);

            return `

                <div class="course-card">

                    <div class="course-image">

                        <img
                            src="${course.image}"
                            alt="${course.title}"
                        >

                    </div>


                    <div class="course-content">

                        <h3>
                            ${course.title}
                        </h3>

                        <p class="instructor">
                            ${course.instructor}
                        </p>

                        <br>

                        <p>
                            Progress
                        </p>

                        <progress
                            value="25"
                            max="100"
                            style="width:100%;"
                        ></progress>

                        <br><br>

                        <button
                            class="btn btn-primary"
                            onclick="alert('Course learning page can be added later.')"
                        >
                            Continue Learning
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


document.addEventListener(
    "DOMContentLoaded",
    renderMyCourses
);

</script>

</body>
</html>
