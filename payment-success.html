<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enrolment Successful - LearnHub</title>

    <link rel="stylesheet" href="style.css">
    <script>(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lh_theme")||"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link">
                Courses
            </a>

            <a href="my-courses.html" class="nav-link">
                My courses
            </a>

        </nav>

    </div>

</header>


<section class="success-page">

    <div class="container">

        <div class="success-icon">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>

        <h1>
            Enrolment successful
        </h1>

        <p>
            You are now enrolled — your courses are listed below.
        </p>

        <div id="paymentInfo"></div>

        <div id="enrolledList"></div>

        <br>

        <a
            href="my-courses.html"
            class="btn btn-primary"
        >
            Go to My courses
        </a>

        <a
            href="courses.html"
            class="btn btn-outline"
        >
            Continue learning
        </a>

    </div>

</section>


<script src="script.js"></script>
<script src="js/api.js"></script>
<script>
/* Enrolment is confirmed against the server (GET /api/my-courses),
   not localStorage: the old page just moved cart ids into a local
   list, so a "successful" checkout never showed real enrolments. */
(function () {
    "use strict";
    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }
    document.addEventListener("DOMContentLoaded", async function () {
        var box = document.getElementById("enrolledList");
        var payBox = document.getElementById("paymentInfo");
        updateCartCount();
        var idsParam = new URLSearchParams(window.location.search).get("payment_ids");
        var paymentIds = idsParam ? idsParam.split(",").filter(Boolean) : [];
        if (!localStorage.getItem("lh_token")) {
            box.innerHTML = '<p>Please <a href="login.html">sign in</a> to see your enrolments.</p>';
            return;
        }
        // Confirm paid status against the server (GET /api/payments/me).
        try {
            var payments = await LearnHubAPI.getMyPayments();
            var mine = paymentIds.length
                ? payments.filter(function (p) { return paymentIds.indexOf(String(p.id)) !== -1; })
                : payments;
            if (payBox) {
                if (mine.length) {
                    var total = mine.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
                    payBox.innerHTML = '<p class="meta">Test mode — Razorpay test mock. No real money was charged.</p>' +
                        "<ul>" + mine.map(function (p) {
                            return "<li>Order <strong>" + esc(p.order_id || ("#" + p.id)) + "</strong> — " + esc(p.course_title || ("Course " + (p.course_id || ""))) +
                                " — " + esc(formatPrice(p.amount)) + " " + esc(p.currency || "INR") + " — status: <strong>" + esc(p.status) + "</strong></li>";
                        }).join("") + "</ul><p><strong>Total paid (test): " + esc(formatPrice(total)) + "</strong></p>";
                } else if (paymentIds.length) {
                    payBox.innerHTML = '<p>Payments are still being confirmed — check <a href="profile.html">your profile</a> for purchase history.</p>';
                } else {
                    payBox.innerHTML = '<p class="meta">Test mode — Razorpay test mock. No real money was charged.</p>';
                }
            }
        } catch (e) {
            if (payBox) payBox.innerHTML = "<p>Could not confirm payment status: " + esc(e.message || "") + "</p>";
        }
        try {
            var courses = await LearnHubAPI.getMyCourses();
            if (!courses.length) {
                box.innerHTML = "<p>No enrolments found yet — your checkout may not have completed. " +
                    '<a href="cart.html">Back to cart</a>.</p>';
                return;
            }
            box.innerHTML = "<ul>" + courses.map(function (c) {
                return '<li><a href="course-details.html?id=' + c.id + '">' +
                    esc(c.title) + "</a> — " + (c.progress_percent || 0) + "% complete</li>";
            }).join("") + "</ul>";
        } catch (e) {
            box.innerHTML = "<p>Could not load your enrolments: " + esc(e.message || "") + "</p>";
        }
    });
})();
</script>

</body>
</html>
