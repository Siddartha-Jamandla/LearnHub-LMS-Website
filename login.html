<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="courses.html" class="nav-link">Courses</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="cart.html" class="nav-icon">
                🛒
                <span id="cart-count" class="cart-count">0</span>
            </a>

            <a href="login.html" class="btn btn-outline">
                Login
            </a>
        </div>

    </div>
</header>


<section class="form-page">

    <div class="form-card">

        <h1>Welcome Back</h1>

        <p>Sign in to continue learning.</p>

        <form id="login-form">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary form-submit">
                Sign In
            </button>

        </form>

        <div class="form-footer">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

    </div>

</section>


<script src="script.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // Real sign-in: server account via POST /api/login (js/auth.js).
    // If you are already signed in, go straight to your dashboard.
    if (window.LearnHubAuth && LearnHubAuth.isSignedIn()) {
        window.location.href = "dashboard.html";
    } else if (window.LearnHubAuth) {
        LearnHubAuth.wireLoginForm("login-form", "dashboard.html");
    }
</script>

</body>
</html>
