<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact us - LearnHub</title>

    <link rel="stylesheet" href="style.css">
    <script>(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lh_theme")||"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link">
                Courses
            </a>

            <a href="about.html" class="nav-link">
                About
            </a>

            <a href="contact.html" class="nav-link active">
                Contact
            </a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            Contact us
        </h1>

        <p>
            Questions about courses, payments or the platform.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="detail-grid">

            <div>

                <h2>
                    Get in touch
                </h2>

                <p>
                    If you have any questions about our courses,
                    payments or learning platform, contact us.
                </p>

                <br>

                <p>
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> support@learnhub.com
                </p>

                <p>
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> +91 98765 43210
                </p>

                <p>
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Hyderabad, India
                </p>

            </div>


            <div class="form-card">

                <form id="contactForm">

                    <div class="form-group">

                        <label>
                            Name
                        </label>

                        <input type="text" id="contactName" placeholder="Enter your name" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input type="email" id="contactEmail" placeholder="Enter your email" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Subject
                        </label>

                        <input type="text" id="contactSubject" placeholder="What is this about?" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Message
                        </label>

                        <textarea id="contactMessage" rows="5" placeholder="Write your message…" required></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary form-submit"
                    >
                        Send Message
                    </button>

                    <p class="status-line" id="contactStatus"></p>

                </form>

            </div>

        </div>

    </div>

</section>


<script src="script.js"></script>
<script src="js/api.js"></script>
<script>
/* Contact form -> POST /api/contact (stored for the admin). The old
   form had no handler at all: submitting just reloaded the page. */
document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var status = document.getElementById("contactStatus");
    var btn = this.querySelector('[type="submit"]');
    btn.disabled = true;
    status.textContent = "Sending…";
    try {
        await LearnHubAPI.submitContact(
            document.getElementById("contactName").value.trim(),
            document.getElementById("contactEmail").value.trim(),
            document.getElementById("contactSubject").value.trim(),
            document.getElementById("contactMessage").value.trim());
        status.textContent = "Thanks — your message has been received. We will get back to you by email.";
        this.reset();
    } catch (err) {
        status.textContent = "Could not send: " + (err.message || "please try again later.");
    } finally {
        btn.disabled = false;
    }
});
</script>


<script>

document
    .getElementById("contactForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            alert(
                "Thank you. Your message has been submitted."
            );

            this.reset();

        }
    );

</script>

</body>
</html>
