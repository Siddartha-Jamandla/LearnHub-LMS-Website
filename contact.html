<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us - LearnHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Learn<span>Hub</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="courses.html" class="nav-link">
                Courses
            </a>

            <a href="about.html" class="nav-link">
                About
            </a>

            <a href="contact.html" class="nav-link active">
                Contact
            </a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            Contact Us
        </h1>

        <p>
            Have questions? We'd love to hear from you.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="detail-grid">

            <div>

                <h2>
                    Get in Touch
                </h2>

                <p>
                    If you have any questions about our courses,
                    payments or learning platform, contact us.
                </p>

                <br>

                <p>
                    📧 support@learnhub.com
                </p>

                <p>
                    📞 +91 98765 43210
                </p>

                <p>
                    📍 Hyderabad, India
                </p>

            </div>


            <div class="form-card">

                <form id="contactForm">

                    <div class="form-group">

                        <label>
                            Name
                        </label>

                        <input type="text" id="contactName" placeholder="Enter your name" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input type="email" id="contactEmail" placeholder="Enter your email" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Subject
                        </label>

                        <input type="text" id="contactSubject" placeholder="What is this about?" required>

                    </div>


                    <div class="form-group">

                        <label>
                            Message
                        </label>

                        <textarea id="contactMessage" rows="5" placeholder="Write your message…" required></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary form-submit"
                    >
                        Send Message
                    </button>

                    <p class="status-line" id="contactStatus"></p>

                </form>

            </div>

        </div>

    </div>

</section>


<script src="script.js"></script>
<script src="js/api.js"></script>
<script>
/* Contact form -> POST /api/contact (stored for the admin). The old
   form had no handler at all: submitting just reloaded the page. */
document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var status = document.getElementById("contactStatus");
    var btn = this.querySelector('[type="submit"]');
    btn.disabled = true;
    status.textContent = "Sending…";
    try {
        await LearnHubAPI.submitContact(
            document.getElementById("contactName").value.trim(),
            document.getElementById("contactEmail").value.trim(),
            document.getElementById("contactSubject").value.trim(),
            document.getElementById("contactMessage").value.trim());
        status.textContent = "✓ Thanks! Your message has been received — we will get back to you by email.";
        this.reset();
    } catch (err) {
        status.textContent = "Could not send: " + (err.message || "please try again later.");
    } finally {
        btn.disabled = false;
    }
});
</script>


<script>

document
    .getElementById("contactForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            alert(
                "Thank you! Your message has been submitted."
            );

            this.reset();

        }
    );

</script>

</body>
</html>
